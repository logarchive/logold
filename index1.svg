<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100vw" height="100vh" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <title>Log</title>
  <desc>Log web app</desc>
  <rect width="1200" height="800" fill="#071107" />
  <foreignObject width="1200" height="800">
    <xhtml:html>
      <xhtml:head>
        <xhtml:meta charset="UTF-8" />
        <xhtml:meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <xhtml:style>
          html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
          body { overflow: hidden; background: #071107; }
          iframe { position: fixed; inset: 0; }
        </xhtml:style>
      </xhtml:head>
      <xhtml:body>
        <xhtml:iframe src="index.html" title="Log app" />
