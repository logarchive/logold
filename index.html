<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071107" />
    <title>Log</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }

      body {
        overflow: hidden;
        background: #071107;
        color: #d8f0d8;
        font: 16px system-ui, sans-serif;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 2rem;
        text-align: center;
      }

      iframe {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <main id="status">Loading Log from jsDelivr…</main>
    <script>
      (async function () {
        const cdn =
          "https://cdn.jsdelivr.net/gh/logthedeveloper/log@main";
        const appBase = `${cdn}/b/`;
        const status = document.getElementById("status");

        try {
          const response = await fetch(`${appBase}index.html`);
          if (!response.ok) {
            throw new Error(`jsDelivr returned HTTP ${response.status}`);
          }

          const app = new DOMParser().parseFromString(
            await response.text(),
            "text/html",
          );
          app.querySelectorAll("[href], [src]").forEach((element) => {
            for (const attribute of ["href", "src"]) {
              const value = element.getAttribute(attribute);
              if (value?.startsWith("https://cdn.jsdelivr.net/gh/logthedeveloper/log@main/")) {
                element.setAttribute(
                  attribute,
                  value.replace(
                    "https://cdn.jsdelivr.net/gh/logthedeveloper/log@main/",
                    `${cdn}/`,
                  ),
                );
              }
            }
          });

          const base = app.createElement("base");
          base.href = appBase;
          app.head.prepend(base);

          const urlBase = app.createElement("script");
          urlBase.textContent = `const NativeURL=window.URL;window.URL=class extends NativeURL{constructor(input,base){super(input,base==="about:srcdoc"||base==="about:blank"?${JSON.stringify(appBase)}:base)}};`;
          app.head.prepend(urlBase);

          let cdnLoaderFound = false;
          app.querySelectorAll("script").forEach((script) => {
            if (script.textContent.includes("window.__SW_FILE__")) {
              script.remove();
              return;
            }

            if (!script.textContent.includes("cherri_cdn_down")) return;

            cdnLoaderFound = true;
            let loader = script.textContent;
            loader = loader.replace(
              /"cdn":"[^"]*"/,
              `"cdn":"${appBase}"`,
            );
            loader = loader.replace(
              '"probe":"build.txt"',
              '"probe":"assets/index-S-LzHe8M-1a510579.css"',
            );
            for (const [stale, current] of [
              [
                "sha384-x2PJfPewBXe3QiD2moo22myv12szD20iiHt8cmm6w2jDv+eqOziekeNhoq5yvr+Z",
                "sha384-jCS5tiXdNW2HyRpAy50QBI26o43zHDwkhXEZMjU/ne1Z5X5VjuJw6y4A6GvUx1PW",
              ],
              [
                "sha384-bFJkChGr4LvJtDXA/+xcjKk04BBW74Byb+3y57GtAp8AU6QY8ldoO5d+RN6r8tdX",
                "sha384-YN1iLRbLdQV4dl/mXa8j0BeO0Q0UCZ8B7kBxjjPFgif4K/vR2c6/RcuiwenFAoCt",
              ],
              [
                "sha384-I37Ks0xr3GV4LMVTLjaHxR80VpYWlJNLNexRGl7trgpG6YO6QUL23grD9OAetPNi",
                "sha384-vth17Nm+h9O9ohAZRtdpgesrWL3TLyjCsoV/EAklwZyo/rP5xSV+aaUEnMXs3/2z",
              ],
            ]) {
              if (!loader.includes(stale)) {
                throw new Error("An app asset integrity value changed.");
              }
              loader = loader.split(stale).join(current);
            }
            loader = loader.replace(
              "/^[0-9a-f]{16}$/.test(n.trim())",
              "n.trim().length > 0",
            );
            if (
              !loader.includes(`"cdn":"${appBase}"`) ||
              !loader.includes('"probe":"assets/index-S-LzHe8M-1a510579.css"') ||
              loader.includes("/^[0-9a-f]{16}$/.test(n.trim())")
            ) {
              throw new Error("The app's CDN loader format has changed.");
            }
            script.textContent = loader;
          });

          if (!cdnLoaderFound) {
            throw new Error("The app's CDN loader was not found.");
          }

          const gameBase = app.createElement("script");
          gameBase.textContent = `window.LOG_GAMES_BASE=${JSON.stringify(`${cdn}/games/`)};`;
          app.head.prepend(gameBase);

          const frame = document.createElement("iframe");
          frame.title = "Log";
          frame.allow = "autoplay; fullscreen; gamepad; clipboard-read; clipboard-write";
          frame.addEventListener(
            "load",
            () => {
              const frameDocument = frame.contentDocument;
              if (!frameDocument) {
                throw new Error("The browser blocked the Log iframe.");
              }

              frameDocument.open();
              frameDocument.write(`<!doctype html>${app.documentElement.outerHTML}`);
              frameDocument.close();
              status.remove();
            },
            { once: true },
          );
          frame.src = "about:blank";
          document.body.append(frame);
        } catch (error) {
          status.textContent = `Could not load Log: ${error.message}. Allow scripts and cross-origin requests in this HTML runner, then try again.`;
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
